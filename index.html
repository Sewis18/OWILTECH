:root {
  --navy: #071A2E;
  --navy-2: #0A1F33;
  --navy-3: #0E2E4D;
  --cyan: #00E5FF;
  --teal: #4FE3E0;
  --teal-deep: #2DD4BF;
  --electric: #1DA1F2;
  --gold: #00E5FF;
  --gold-dark: #00B8D4;
  --ink: #0A1F33;
  --muted: #52687F;
  --surface: #FFFFFF;
  --surface-2: #EFFBFF;

@media (prefers-color-scheme: dark) {
  :root {
    --navy: #071A2E;

    --navy-3: #12365A;
    --cyan: #00E5FF;
    --teal: #4FE3E0;
    --ink: #EDF7FB;
    --muted: #B7CDD8;
    --surface: #071A2E;
    --surface-2: #0A1F33;
    --line: #274A66;
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--navy);
  color: var(--ink);
  font-family: "Public Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

h1, h2, h3, .font-display {
  font-family: "Sora", "Public Sans", system-ui, sans-serif;
}

::-moz-selection {
  background: var(--cyan);
  color: #071A2E;
}

::selection {
  background: var(--cyan);
  color: #071A2E;
}

a {
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 3px;
}
